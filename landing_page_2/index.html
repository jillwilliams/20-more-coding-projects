<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" Unicode="U+1F334, UTF-8: F0 9F 8C B4" Unicode= "U+1F332, UTF-8: F0 9F 8C B2" Unicode= "U+00A9"  Unicode="U+00A9, UTF-8: C2 A9" Unicode="U+1F440, UTF-8: F0 9F 91 80">
    <title>Landing Page V.2</title>
    <link HREF="https://fonts.googleapis.com/css?family=Dancing+Script|Indie+Flower|Shadows+Into+Light|Fresca|Nunito|Yoyu|Iceland|Gravitas One|Arial|Yeseva One|Tagesschrift|du+NSW+ACT+Cursive|BenchNine|Birthstone|Jolly Lodger|Quicksand|Raleway" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/9f71dab2a2.js" crossorigin="anonymous"></script>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/> -->

    <!-- <meta name="keywords" content="”> -->
</head>
<body>
    <div class="container">
        <div class="navbar">
            <img src="../images/codegeek_icon.png" alt="logo">
            <h1>Code Geek</h1>
        </div>
        <div class="list" id="home">
            <ul>
                <li><a href="#home">HOME</a><li>
                <li><a href="#news">NEWS</a><li></li> 
                <li><a href="#contact">CONTACT US</a><li></li> 
            </ul>
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="search" placeholder=" Search...">
        </div>
    </div>  

    <div class="second-section">
        <div class="header">
            <h3>Hello, it's me</h3>
            <h1>JK Williams</h1>
            <h3>And I'm a Coder</h3>
        </div>
        <button id="#" class="about-me">About Me</button>
        <button id="#" class="follow-me">Follow Me</button>
        <img src="../images/golden_skull.png" alt="skull image" id="skull-img">
    </div>
    
    <div class="third-section" id="news">
        <h3>CURRENT NEWS</h3>
        <a href="https://www.foxnews.com/"><img src="../images/foxnews.png" id="foxnews"></a>
        
        <a href="https://www.newsmax.com"><img src="../images/newsmax.png" id="newsmax"></a>

        <a href="https://www.glennbeck.com"><img src="../images/glennbeck.png" id="glennbeck"></a>
    </div>
    <div class="fourth-section" id="contact">
        <h3>CONTACT US</h3>
        <div class="icons">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-x-twitter"></i>
            <i class="fa-brands fa-discord"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-github"></i>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
